<!DOCTYPE html>
<html>
<head>
    <title>Test Expenses App</title>
    <script>
        function testCoreFunctionality() {
            console.log("Testing core functionality...");
            
            // Test 1: Check if localStorage is available
            if (typeof localStorage !== 'undefined') {
                console.log("✅ localStorage is available");
            } else {
                console.log("❌ localStorage not available");
                return false;
            }
            
            // Test 2: Check if Chart.js is loaded
            if (typeof Chart !== 'undefined') {
                console.log("✅ Chart.js is available");
            } else {
                console.log("⚠️ Chart.js not loaded");
            }
            
            // Test 3: Check if app.js functions exist
            if (typeof window.app !== 'undefined') {
                console.log("✅ App object is available");
                
                // Test transaction manager
                if (window.app.transactionManager) {
                    console.log("✅ Transaction manager available");
                } else {
                    console.log("❌ Transaction manager not found");
                }
                
                // Test balance display
                if (window.app.balanceDisplay) {
                    console.log("✅ Balance display available");
                } else {
                    console.log("❌ Balance display not found");
                }
            } else {
                console.log("❌ App object not found - check app.js loading");
            }
            
            console.log("Core functionality test complete");
            return true;
        }
        
        // Run test when page loads
        window.addEventListener('load', testCoreFunctionality);
    </script>
</head>
<body>
    <h1>Test Page for Expenses App</h1>
    <p>Open browser console to see test results</p>
    
    <!-- Load the actual app files -->
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
